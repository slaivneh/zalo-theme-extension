<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 310px;
        padding: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        margin: 0;
      }
      h3 {
        margin: 0 0 10px 0;
        font-size: 15px;
        text-align: center;
        color: #0068ff;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .card-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #0f172a;
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 4px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
        gap: 8px;
      }
      label {
        font-size: 12px;
        color: #475569;
      }
      input[type="color"] {
        width: 50px;
        height: 26px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 7px;
        font-size: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        margin-bottom: 5px;
      }
      input[type="file"] {
        font-size: 11px;
        flex: 1;
        min-width: 0;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-clear {
        flex: none;
        padding: 3px 8px;
        font-size: 11px;
        background: #fee2e2;
        color: #b91c1c;
        border-radius: 4px;
      }
      .btn-clear:hover {
        background: #fecaca;
      }
      .hint {
        font-size: 10px;
        color: #94a3b8;
        margin-top: 4px;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      #btnSave {
        background: #0068ff;
        color: #fff;
      }
      #btnSave:hover {
        background: #0052cc;
      }
      #btnReset {
        background: #e2e8f0;
        color: #475569;
      }
      #btnReset:hover {
        background: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <h3>🎨 Tùy biến Zalo Web</h3>

    <!-- 1. Thanh Menu trái -->
    <div class="card">
      <div class="card-title">1. Thanh Menu dọc (Bên trái)</div>
      <div class="row">
        <label>Màu nền:</label>
        <input type="color" id="navColor" value="#0068ff" />
      </div>
      <input
        type="text"
        id="navImg"
        placeholder="Link ảnh nền (hoặc chọn file bên dưới)"
      />
      <div class="file-row">
        <input type="file" id="navFile" accept="image/*" />
        <button class="btn-clear" data-key="navImg" data-file="navFile">
          Xóa ảnh
        </button>
      </div>
      <div class="hint">
        * Nếu có ảnh, ảnh sẽ đè lên màu nền (bấm "Xóa ảnh" để dùng lại màu)
      </div>
    </div>

    <!-- 2. Danh sách hội thoại -->
    <div class="card">
      <div class="card-title">2. Nền danh sách hội thoại</div>
      <div class="row">
        <label>Màu nền:</label>
        <input type="color" id="listColor" value="#ffffff" />
      </div>
      <input
        type="text"
        id="listImg"
        placeholder="Link ảnh nền (hoặc chọn file bên dưới)"
      />
      <div class="file-row">
        <input type="file" id="listFile" accept="image/*" />
        <button class="btn-clear" data-key="listImg" data-file="listFile">
          Xóa ảnh
        </button>
      </div>
    </div>

    <!-- 3. Khung chat chính -->
    <div class="card">
      <div class="card-title">3. Nền khung đoạn chat</div>
      <div class="row">
        <label>Màu nền:</label>
        <input type="color" id="chatColor" value="#eef0f1" />
      </div>
      <input
        type="text"
        id="chatImg"
        placeholder="Link ảnh nền (hoặc chọn file bên dưới)"
      />
      <div class="file-row">
        <input type="file" id="chatFile" accept="image/*" />
        <button class="btn-clear" data-key="chatImg" data-file="chatFile">
          Xóa ảnh
        </button>
      </div>
    </div>

    <!-- 4. Bong bóng chat -->
    <div class="card">
      <div class="card-title">4. Màu bong bóng chat</div>
      <div class="row">
        <label>Tin nhắn bạn gửi:</label>
        <input type="color" id="bubbleMeColor" value="#e5efff" />
      </div>
      <div class="row">
        <label>Tin nhắn người khác:</label>
        <input type="color" id="bubbleYouColor" value="#ffffff" />
      </div>
      <div class="row">
        <label>Màu chữ tin nhắn:</label>
        <input type="color" id="bubbleTextColor" value="#081c36" />
      </div>
    </div>

    <div class="btn-group">
      <button id="btnSave">Áp dụng ngay</button>
      <button id="btnReset">Mặc định</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
